services:
  - type: web
    name: roomfinder-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ROOMFINDER_DEBUG
        value: "False"
      - key: ROOMFINDER_ALLOWED_HOSTS
        value: roomfinder-api.onrender.com
      - key: ROOMFINDER_CORS_ORIGINS
        value: https://roomfinder-frontend.onrender.com
      - key: ROOMFINDER_CSRF_TRUSTED_ORIGINS
        value: https://roomfinder-frontend.onrender.com

  - type: web
    name: roomfinder-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://roomfinder-api.onrender.com/api/v1/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
