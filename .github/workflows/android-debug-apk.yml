name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check hosted API
        run: |
          status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' https://roomfinder-production-4a6b51e9.up.railway.app/api/v1/health/)
          echo "Hosted API HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Hosted API returned HTTP $status. The APK can build, but its online features need a healthy backend."
          fi

      - name: Install web and Capacitor dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install @capacitor/core@^8 @capacitor/android@^8 --no-audit --no-fund
          npm install --save-dev @capacitor/cli@^8 --no-audit --no-fund

      - name: Build Vue for Android
        working-directory: frontend
        run: npm run build:android

      - name: Create Android project
        working-directory: frontend
        run: npx cap add android

      - name: Build debug APK
        working-directory: frontend/android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Print APK checksum
        run: sha256sum frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoomFinder-Android-reviewable
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
