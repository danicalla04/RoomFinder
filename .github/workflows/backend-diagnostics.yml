name: Check hosted backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-diagnostics.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check health endpoint
        run: |
          curl --silent --show-error --max-time 30 --dump-header headers.txt --output body.txt \
            https://roomfinder-production-4a6b51e9.up.railway.app/api/v1/health/
          echo "--- Response headers ---"
          cat headers.txt
          echo "--- Response body ---"
          head --bytes 4000 body.txt
          echo

      - name: Check Android login preflight
        run: |
          curl --silent --show-error --max-time 30 --request OPTIONS \
            --header 'Origin: http://localhost' \
            --header 'Access-Control-Request-Method: POST' \
            --dump-header headers.txt --output body.txt \
            https://roomfinder-production-4a6b51e9.up.railway.app/api/v1/auth/token/
          echo "--- Response headers ---"
          cat headers.txt
          echo "--- Response body ---"
          head --bytes 4000 body.txt
          echo
